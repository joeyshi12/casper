name: Release

# Create a GitHub release whenever the version in package.json changes on main.
# The tag/release is v<version>. Idempotent: skips if that release already
# exists, and only fires when the version field actually changed (not on every
# package.json edit).
on:
  push:
    branches: [main]
    paths: ['package.json']
  # Allows re-running for the current version if a push was missed.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      current: ${{ steps.v.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff against the push's base commit

      - name: Detect version change
        id: v
        run: |
          current="$(node -p "require('./package.json').version")"

          # Compare against the commit the branch was at BEFORE this push - not
          # HEAD~1. A push can contain several commits, and the bump is often not
          # the last one (e.g. a lockfile sync follows it), in which case HEAD~1
          # already has the new version and the change would be missed.
          base="${{ github.event.before }}"
          case "$base" in
            ''|0000000000000000000000000000000000000000) base="" ;;
          esac
          if [ -z "$base" ] && [ "${{ github.event_name }}" = "push" ]; then
            base="HEAD~1"
          fi

          previous=""
          if [ -n "$base" ] && git cat-file -e "$base:package.json" 2>/dev/null; then
            git show "$base:package.json" > /tmp/prev-package.json
            previous="$(node -p "require('/tmp/prev-package.json').version || ''")"
          fi

          echo "current=$current"   >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "package.json version: ${previous:-<none>} -> $current (base: ${base:-<none>})"

      # Manual runs release the current version even if it didn't change in a push.
      - name: Create release
        if: steps.v.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.current }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes

  # Publishing is separate from the GitHub release so a failed publish leaves the
  # tag intact and can be retried with workflow_dispatch.
  #
  # Authenticates with the NPM_TOKEN secret, which means CI can make the very first
  # publish too - npm's trusted publishing can only be configured for a package that
  # already exists, so it can't bootstrap one. The token needs to publish without an
  # OTP prompt: use a granular access token with write access to this package, or a
  # classic Automation token. id-token: write is still required, because that's what
  # signs the provenance attestation.
  publish:
    needs: release
    if: needs.release.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC credential + provenance signature
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Writes the .npmrc that reads NODE_AUTH_TOKEN. Without registry-url there
          # is no auth line at all and the publish fails with ENEEDAUTH.
          registry-url: 'https://registry.npmjs.org'

      - name: Check the token is present
        # Fail with something readable instead of an ENEEDAUTH after a full build.
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN is not set. Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.release.outputs.current }}"
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
            exit 0
          fi
          # prepack builds the bundle and the web app, so this ships a fresh dist.
          # --provenance needs id-token: write above and a repository field that
          # matches this repo, which package.json has.
          npm publish --provenance
